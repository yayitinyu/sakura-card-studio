services:
  studio:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      PORT: 3000
      APP_SECRET: ${APP_SECRET:-}
      DATABASE_URL: file:/app/data/app.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
